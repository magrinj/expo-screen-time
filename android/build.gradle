plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screentime'
version = '0.3.0' // x-release-please-version

def webPreview = providers.gradleProperty('expoScreenTime.webPreview').orNull == 'true'
def webPreviewFgsType = providers.gradleProperty('expoScreenTime.webPreviewFgsType').getOrElse('systemExempted')
if (webPreview && !(webPreviewFgsType in ['none', 'systemExempted', 'specialUse'])) {
  throw new GradleException('expoScreenTime.webPreviewFgsType must be none, systemExempted, or specialUse')
}

android {
  namespace "expo.modules.screentime"
  buildFeatures { buildConfig true }
  defaultConfig {
    versionCode 1
    versionName "0.3.0" // x-release-please-version
    buildConfigField 'boolean', 'WEB_PREVIEW', 'false'
    buildConfigField 'String', 'WEB_PREVIEW_FGS_TYPE', '"none"'
  }
  buildTypes {
    debug {
      if (webPreview) {
        buildConfigField 'boolean', 'WEB_PREVIEW', 'true'
        buildConfigField 'String', 'WEB_PREVIEW_FGS_TYPE', '"' + webPreviewFgsType + '"'
      }
    }
  }
  if (webPreview) {
    sourceSets.debug {
      java.srcDir 'src/webPreview/java'
      manifest.srcFile "src/webPreview/${webPreviewFgsType}/AndroidManifest.xml"
    }
  }
  lintOptions {
    abortOnError false
  }
}

// The oldest Kotlin of a supported Expo SDK (54 to 57 ship 2.1.20): code
// that needs a newer language or stdlib fails here, on any SDK.
kotlin {
  compilerOptions {
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1
  }
}

dependencies {
  // JVM unit tests of the pure parts (android/src/test).
  // `org.json` is a stub in android.jar.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}

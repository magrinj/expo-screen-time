plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screentime'
version = '0.2.0' // x-release-please-version

android {
  namespace "expo.modules.screentime"
  defaultConfig {
    versionCode 1
    versionName "0.2.0" // x-release-please-version
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests of the pure parts (android/src/test): the permission
  // derivation and the state store. `org.json` is a stub in android.jar.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}

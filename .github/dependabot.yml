version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # These are pinned to the Expo SDK — bump them during an SDK upgrade, not
      # à la carte. Allow patches (same SDK), block the minor/major jumps that
      # change the SDK (e.g. RN 0.88 → 0.89 = SDK 59; @expo/plist 0.10 → 0.11 no
      # longer satisfies @expo/config-plugins@58's ^0.10.1).
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-module-scripts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/plist"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: bun
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

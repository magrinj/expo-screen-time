version: 2
updates:
  # Keep GitHub Actions versions current (fully bun-independent).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # npm deps. Note: Dependabot doesn't update bun.lock — these PRs bump the
  # package.json manifests; re-run `bun install` to refresh the lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # These are pinned to the Expo SDK — bump them during an SDK upgrade, not
      # à la carte. Allow patches (same SDK), block the minor/major jumps that
      # change the SDK (e.g. RN 0.85 → 0.86 = SDK 57; @expo/plist 0.7 → 0.8 no
      # longer satisfies @expo/config-plugins@56's ^0.7.0).
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-module-scripts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/plist"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

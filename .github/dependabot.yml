version: 2
updates:
  # Keep GitHub Actions versions current (fully bun-independent).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # npm deps. Note: Dependabot doesn't update bun.lock — these PRs bump the
  # package.json manifests; re-run `bun install` to refresh the lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # react / react-native / expo are pinned to the Expo SDK — bump them during
      # an SDK upgrade, not à la carte. Allow patches (same SDK), block the
      # minor/major jumps that change the SDK (e.g. RN 0.85 → 0.86 = SDK 57).
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

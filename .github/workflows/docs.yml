name: Docs

# Builds the Docusaurus site in website/ and deploys it to GitHub Pages.
# `configure-pages` with enablement:true turns Pages on automatically on the
# first push to main (no manual Settings → Pages step). PRs only build to catch
# breakage; the Pages steps run on push/dispatch only.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install & build
        working-directory: website
        run: |
          bun install
          bun run build
      # Pages steps run only on push/dispatch — PRs (incl. dependabot/forks) just
      # validate the build above and don't touch Pages.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    needs: build
    # PRs only build (above) to catch breakage; deploy happens on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

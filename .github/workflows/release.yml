name: Release

# release-please maintains a "Release PR" from your conventional commits (version
# bump + CHANGELOG.md). Merge that PR → it tags + creates the GitHub Release, then
# this same workflow publishes to npm via OIDC trusted publishing.
#
# One-time npm setup: package → Settings → Trusted Publisher → GitHub Actions,
# repo magrinj/expo-screen-time, workflow file release.yml.
#
# Publish failed after the release was created? Re-running the job does not
# help: release-please already labelled the PR "autorelease: tagged", so it
# reports no new release and the publish steps are skipped. Fix the cause, then
# run this workflow by hand with the tag instead (Actions → Release → Run
# workflow, or `gh workflow run release.yml -f tag=v0.2.0`).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (e.g. v0.2.0)
        required: true

permissions:
  contents: write # create the release PR, tags, and GitHub releases
  pull-requests: write # open/update the release PR
  id-token: write # OIDC npm publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        if: ${{ github.event_name == 'push' }}
        # config: release-please-config.json + .release-please-manifest.json

      # Everything below runs ONLY when a Release PR was just merged
      # (release-please created a tag + GitHub Release this run), or when a
      # tag is published by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ inputs.tag }} # empty on push: the pushed commit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Publish to npm (OIDC trusted publishing)
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          bun install --frozen-lockfile
          bun run build
          npm publish --access public

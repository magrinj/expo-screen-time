name: Publish

# Publishes to npm when a GitHub Release is published. Bump the version in
# package.json and create the release/tag; this workflow does the rest.
#
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. One-time setup
# on npmjs.com: package → Settings → Trusted Publisher → GitHub Actions, with
# this repo and workflow file (publish.yml). npm then mints a short-lived token
# per run and attaches build provenance automatically.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run build
      - run: npm publish --access public

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      swift: ${{ steps.filter.outputs.swift }}
      android: ${{ steps.filter.outputs.android }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # A push to main runs every job; a PR only the jobs its files can break.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$([ -n "$BASE" ] && git diff --name-only "$BASE" HEAD || echo '*')
          out() {
            if [ "$files" = '*' ] || printf '%s\n' "$files" | grep -qE "$2"; then v=true; else v=false; fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          shared='^(src/|plugin/|example/|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)'
          out ios "$shared|^(ios/|targets/)"
          out swift '^(ios/|targets/|scripts/swift-tests/|\.github/workflows/ci\.yml$)'
          out android "$shared|^android/"
          out website '^(website/|\.github/workflows/ci\.yml$)'

  check:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - name: Type-check the example app
        working-directory: example
        run: |
          bun install --frozen-lockfile
          bun x tsc --noEmit
      - name: Check the npm tarball
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map((f) => f.path);
            const bad = files.filter((p) => /(^|\/)__tests__\/|^(example|docs|website|test)\/|^android\/(build|src\/test)\//.test(p));
            if (bad.length) { console.error("Must not ship:\n" + bad.join("\n")); process.exit(1); }
            console.log(files.length + " files");
          ' "$RUNNER_TEMP/pack.json"

  prebuild:
    name: iOS prebuild (4 extension targets, idempotent)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # postinstall builds plugin/build and links the module into example
      - name: Install example app
        working-directory: example
        run: bun install --frozen-lockfile
      - name: Prebuild iOS
        working-directory: example
        run: bun expo prebuild --platform ios --no-install --clean
      - name: Assert 4 app-extension targets, no orphan paths
        working-directory: example
        run: |
          pbxproj=ios/exposcreentimeexample.xcodeproj/project.pbxproj
          count=$(grep -c 'com.apple.product-type.app-extension' "$pbxproj")
          echo "app-extension targets: $count"
          test "$count" -eq 4
          if grep -q 'undefined/' "$pbxproj"; then
            echo "::error::found 'undefined/' path in pbxproj (group path regression)"
            exit 1
          fi
      - name: Re-running prebuild changes nothing
        working-directory: example
        run: |
          cp -R ios "$RUNNER_TEMP/ios-first"
          bun expo prebuild --platform ios --no-install --no-clean
          diff -r "$RUNNER_TEMP/ios-first" ios

  swift:
    name: Swift logic tests
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swiftc --version
      - run: bash scripts/swift-tests/run.sh

  android:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install example app
        working-directory: example
        run: bun install --frozen-lockfile
      - name: Prebuild Android
        working-directory: example
        run: bun expo prebuild --platform android --no-install --clean
      - name: Re-running prebuild changes nothing
        working-directory: example
        run: |
          cp -R android "$RUNNER_TEMP/android-first"
          bun expo prebuild --platform android --no-install --no-clean
          diff -r "$RUNNER_TEMP/android-first" android
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Kotlin unit tests
        working-directory: example/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :expo-screen-time:testDebugUnitTest --console=plain

  website:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run types:check
      - run: bun run build
        env:
          PAGES_BASE_PATH: /expo-screen-time

  # The one check to require on main: green when every job passed or was skipped.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, check, prebuild, swift, android, website]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed or were skipped."

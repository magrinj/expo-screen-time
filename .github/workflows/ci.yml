name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  prebuild:
    name: Prebuild integration (4 extension targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # postinstall builds plugin/build + symlinks the module into example
      - name: Install example app
        working-directory: example
        run: bun install --frozen-lockfile
      - name: Prebuild iOS (skip pod/npm install)
        working-directory: example
        run: bun expo prebuild --platform ios --no-install --clean
      - name: Assert the plugin wired 4 app-extension targets, no orphan paths
        working-directory: example
        run: |
          pbxproj=ios/exposcreentimeexample.xcodeproj/project.pbxproj
          count=$(grep -c 'com.apple.product-type.app-extension' "$pbxproj")
          echo "app-extension targets: $count"
          test "$count" -eq 4
          if grep -q 'undefined/' "$pbxproj"; then
            echo "::error::found 'undefined/' path in pbxproj (group path regression)"
            exit 1
          fi

  swift:
    # The pure Swift layer the module and its extensions share (block
    # composition, schedules, registrations, the cross-process lock, ...):
    # its logic tests, the byte-identity of every per-target copy, and two
    # processes contending on the real flock. Needs swiftc, hence macOS.
    name: Swift logic tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swiftc --version
      - run: bash scripts/swift-tests/run.sh

  android:
    # The Kotlin module (engine, selections, reports, ...): it compiles against
    # the example's prebuild and its JUnit tests pass. The runner image ships
    # the Android SDK and JDK 17.
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install example app
        working-directory: example
        run: bun install --frozen-lockfile
      - name: Prebuild Android
        working-directory: example
        run: bun expo prebuild --platform android --no-install --clean
      - name: Kotlin unit tests
        working-directory: example/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :expo-screen-time:testDebugUnitTest --console=plain
